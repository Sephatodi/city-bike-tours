services:
  - type: web
    name: city-bike-tours-backend
    runtime: node
    plan: starter
    rootDir: city-bike-tours-main/backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAILS
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: BLOB_PRIVATE_READ_WRITE_TOKEN
        sync: false